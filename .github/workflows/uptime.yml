# The server's own tick says when /health fails, from the same machine: it cannot say the machine, its tunnel or
# whatever is in front of it is gone. This asks from outside, as an app's servers do, every quarter of an hour.
# It does nothing until the repository variable BRIDGE_HEALTH_URL is set (a fork pings nobody). A failed run is
# reported the way GitHub reports any; BRIDGE_DOWN_ALERT, a secret, can name an ntfy topic to post to as well.
# GitHub runs schedules late at busy times, and turns them off after 60 days without a commit.
name: uptime
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  outside:
    if: vars.BRIDGE_HEALTH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: health, sign-in metadata and the MCP door answer from outside
        env:
          HEALTH: ${{ vars.BRIDGE_HEALTH_URL }}
          ALERT: ${{ secrets.BRIDGE_DOWN_ALERT }}
        run: |
          base="${HEALTH%/health}"
          up() {
            curl -fsS -m 20 "$HEALTH" | grep -q '"ok":true' &&
              curl -fsS -m 20 "$base/.well-known/oauth-authorization-server" | grep -q '"issuer"' &&
              [ "$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST "$base/mcp" \
                    -H 'content-type: application/json' -d '{}')" = 401 ]
          }
          for try in 1 2 3; do          # one failure is often a tunnel reconnecting
            if up; then exit 0; fi
            sleep 40
          done
          if [ -n "$ALERT" ]; then curl -sS -m 20 -d "Bridge is not answering from outside: $base" "$ALERT" || true; fi
          exit 1
