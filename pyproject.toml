[project]
name = "bridge"
version = "0.1.0"
description = "Bridge: people's own AI assistants find each other something worth doing, unnamed until both say yes. The protocol's reference server."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2",
  "starlette>=0.47",
  "uvicorn>=0.34",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "cryptography>=45",
]

[project.scripts]
bridge = "bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
